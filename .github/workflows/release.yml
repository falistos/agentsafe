name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.1.0. Must match Cargo.toml.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Refuse a tag that does not match Cargo.toml
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -eu
          case "$TAG" in
            v*) ;;
            *) echo "tag must look like v0.1.0, got: ${TAG}" >&2; exit 1 ;;
          esac
          file_version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          tag_version=${TAG#v}
          if [ "$tag_version" != "$file_version" ]; then
            echo "tag ${TAG} does not match Cargo.toml version ${file_version}" >&2
            exit 1
          fi
      - name: Install the stable toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"
      - name: Build and pack
        env:
          TAG: ${{ inputs.tag }}
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          crate=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          cargo build --release --target "$TARGET"
          built="target/${TARGET}/release/${crate}"
          test -x "$built"
          cp "$built" agentsafe
          COPYFILE_DISABLE=1 tar -czf "agentsafe-${TAG}-${TARGET}.tar.gz" agentsafe
      - uses: actions/upload-artifact@v7
        with:
          name: agentsafe-${{ inputs.tag }}-${{ matrix.target }}
          path: agentsafe-${{ inputs.tag }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and draft release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          cd dist
          sha256sum -- *.tar.gz | sort -k 2 > SHA256SUMS
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" --notes "Draft release." SHA256SUMS ./*.tar.gz
