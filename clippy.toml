# A bool parameter is unreadable at the call site: use a two-variant enum or two functions.
max-fn-params-bools = 0

# In tests a panic is the assertion. Since Clippy 1.100 this also covers integration
# tests (every input path under `tests/`), so those crates must not `expect(unwrap_used)`:
# the lint no longer fires, and the expectation is unfulfilled.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
