<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}{% endblock %} · agentsafe</title>
<style>
:root{--bg:#fff;--fg:#1b1b1b;--muted:#656565;--line:#dcdcdc;--field:#f5f5f5;--accent:#0b57d0;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#151515;--fg:#e6e6e6;--muted:#9b9b9b;--line:#333;--field:#1f1f1f;--accent:#8ab4f8;--warn:#f2b8b5}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
header,main{max-width:60rem;margin:0 auto;padding:.75rem 1rem}
header{display:flex;gap:1rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}
header .brand{font-weight:600;margin-right:auto}
a{color:var(--accent)}
h1{font-size:1.4rem;margin:.5rem 0 1rem}
h2{font-size:1.1rem;margin:2rem 0 .5rem}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:.4rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;white-space:nowrap}
.scroll{overflow-x:auto}
label{display:block;margin:.75rem 0 .2rem;color:var(--muted);font-size:.9rem}
input,textarea{box-sizing:border-box;width:100%;padding:.5rem;font:inherit;color:inherit;background:var(--field);border:1px solid var(--line);border-radius:4px}
textarea{min-height:7rem;font-family:ui-monospace,monospace;font-size:.9rem}
button{margin-top:1rem;padding:.5rem 1rem;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--line);border-radius:4px}
button.danger{color:var(--warn);border-color:var(--warn)}
.muted{color:var(--muted)}
.overdue{color:var(--warn);font-weight:600}
.notice{padding:.5rem .75rem;background:var(--field);border-left:3px solid var(--accent)}
.error{padding:.5rem .75rem;background:var(--field);border-left:3px solid var(--warn)}
code,.value{font-family:ui-monospace,monospace;font-size:.9rem;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<header>
<a class="brand" href="/">agentsafe</a>
<a href="/">Entries</a>
<a href="/new">New entry</a>
{% if audit %}<a href="/audit">Audit</a>{% endif %}
</header>
<main>
{% if notice %}<p class="notice">{{ notice }}</p>{% endif %}
{% block body %}{% endblock %}
</main>
</body>
</html>
