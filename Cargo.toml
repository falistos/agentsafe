[package]
name = "agentsafe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A secrets manager for AI agents: names and metadata for the agent, values only inside child processes and rendered files"
license = "MIT OR Apache-2.0"
repository = "https://github.com/falistos/agentsafe"
keywords = ["secrets", "age", "ai-agents", "cli", "vault"]
categories = ["command-line-utilities", "cryptography"]

[dependencies]
age = "0.12.1"
aho-corasick = "1.1.5"
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jiff = { version = "0.2.39", features = ["serde"] }
minijinja = { version = "3.0.5", default-features = false, features = ["builtins"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
toml = "1.2.0"
zeroize = "1.9.1"
