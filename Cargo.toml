[package]
name = "agentsafe"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Secrets for AI agents: values reach child processes and rendered files, never the agent's output"
license = "MIT OR Apache-2.0"
repository = "https://github.com/falistos/agentsafe"
keywords = ["secrets", "age", "ai-agents", "cli", "vault"]
categories = ["command-line-utilities", "cryptography"]
exclude = [".github/"]

[dependencies]
age = "0.12.1"
aho-corasick = "1.1.5"
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1", "form", "query"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
hex = "0.4.3"
jiff = { version = "0.2.39", features = ["serde"] }
minijinja = { version = "3.0.5", default-features = false, features = ["builtins", "multi_template", "serde"] }
rustix = { version = "1.1.6", features = ["process", "stdio", "termios"] }
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
signal-hook = "0.4.6"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
toml = "1.2.0"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
zeroize = "1.9.1"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[dev-dependencies]
rustix = { version = "1.1.6", features = ["process", "pty", "fs"] }

# BeautifulRust's lints (github.com/morganlinton/BeautifulRust), without the library-only ones.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "allow"
panic_in_result_fn = "warn"
missing_assert_message = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
as_conversions = "warn"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
